<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Faijul Islam Saimon, Cybersecurity Specialist" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#14213d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0.04"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="14" fill="url(#dots)"/>

  <!-- left accent bar -->
  <rect x="56" y="78" width="4" height="150" rx="2" fill="url(#accent)"/>

  <!-- text -->
  <text x="84" y="132" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="58" font-weight="700" fill="#ffffff" letter-spacing="0.5">Faijul Islam Saimon</text>
  <text x="86" y="182" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="600" fill="url(#accent)" letter-spacing="3">CYBERSECURITY SPECIALIST</text>
  <text x="86" y="224" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" fill="#9fb0c9" letter-spacing="1">WordPress Security  ·  Penetration Testing  ·  Python</text>

  <!-- circuit lines -->
  <g stroke="url(#accent)" stroke-opacity="0.45" stroke-width="1.5" fill="none">
    <path d="M1075 120 H1140 V80 H1180"/>
    <path d="M1075 150 H1180"/>
    <path d="M1075 180 H1140 V220 H1180"/>
    <path d="M925 120 H870 V80"/>
    <path d="M925 180 H870 V220"/>
  </g>
  <g fill="#22d3ee" fill-opacity="0.8">
    <circle cx="1180" cy="80" r="3.5"/>
    <circle cx="1180" cy="150" r="3.5"/>
    <circle cx="1180" cy="220" r="3.5"/>
    <circle cx="870" cy="80" r="3.5"/>
    <circle cx="870" cy="220" r="3.5"/>
  </g>

  <!-- shield -->
  <path d="M1000 58 L1078 90 V160 C1078 206 1042 236 1000 254 C958 236 922 206 922 160 V90 Z"
        fill="url(#shield)" stroke="url(#accent)" stroke-width="3" stroke-linejoin="round"/>
  <path d="M1000 84 L1056 106 V160 C1056 192 1030 214 1000 228 C970 214 944 192 944 160 V106 Z"
        fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- keyhole -->
  <circle cx="1000" cy="146" r="14" fill="none" stroke="#2dd4bf" stroke-width="4"/>
  <path d="M1000 160 V186" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round"/>
  <path d="M1000 174 H1010" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round"/>

  <!-- bottom line -->
  <rect x="56" y="278" width="1088" height="2" rx="1" fill="url(#accent)" fill-opacity="0.5"/>
</svg>
